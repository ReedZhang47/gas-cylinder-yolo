const allowed=new Set(D.items.map(x=>x.id));
function initial(item){let a=item.R1,b=item.R2;return {blind_id:item.id,usability:a.usability.map((v,i)=>v===b.usability[i]?v:''),realism:a.realism===b.realism?a.realism:'',requirements:a.requirements.map((v,i)=>v===b.requirements[i]?v:''),usability_reasons:a.usability.map((v,i)=>v===b.usability[i]?[...a.usability_reasons[i]]:[]),usability_other:a.usability.map((v,i)=>v===b.usability[i]?a.usability_other[i]:''),revealed_at:null}}
function current(){let item=D.items[index];return records[item.id]||(records[item.id]=initial(item))}
function missing(r){let result=[];r.usability.forEach((v,i)=>{if(!v)result.push('可用性'+(i+1));else if(v!=='pass'){if(!r.usability_reasons[i].length)result.push('可用性'+(i+1)+'原因');if(r.usability_reasons[i].includes('other')&&!r.usability_other[i].trim())result.push('其它说明')}});if(!r.realism)result.push('真实性');r.requirements.forEach((v,i)=>{if(!v)result.push('提示词'+(i+1))});return result}
function complete(r){return !!r.revealed_at&&!missing(r).length}
function valid(r){if(!r||!allowed.has(r.blind_id)||!Array.isArray(r.usability)||r.usability.length!==2||r.usability.some(x=>!['',...Object.keys(names)].includes(x))||!Array.isArray(r.requirements)||r.requirements.length!==4||r.requirements.some(x=>!['','pass','fail'].includes(x))||!['',...Object.keys(realism)].includes(r.realism))throw Error('裁决结构不匹配');if('visible_count' in r||!Array.isArray(r.usability_reasons)||r.usability_reasons.length!==2||!Array.isArray(r.usability_other)||r.usability_other.length!==2)throw Error('原因结构不匹配');r.usability_reasons.forEach((list,i)=>{let options=new Set(D.reasonOptions[i].map(x=>x.code));if(!Array.isArray(list)||list.some(v=>!options.has(v))||new Set(list).size!==list.length||typeof r.usability_other[i]!=='string'||(r.usability_other[i].trim()&&!list.includes('other'))||(['','pass'].includes(r.usability[i])&&(list.length||r.usability_other[i].trim())))throw Error('原因无效')});if(r.revealed_at!==null&&typeof r.revealed_at!=='string')throw Error('确认记录无效');if(r.revealed_at&&missing(r).length)throw Error('已确认裁决存在缺项');return r}
try{let saved=JSON.parse(localStorage.getItem(key)||'null');if(saved){Object.values(saved.records||{}).forEach(valid);records=saved.records||{};index=Number.isInteger(saved.index)&&saved.index>=0&&saved.index<D.items.length?saved.index:0;started=saved.started||started}}catch(e){storageOK=false;$('message').textContent='自动保存读取失败，请导入备份。'}
function persist(){try{localStorage.setItem(key,JSON.stringify({records,index,started}))}catch(e){storageOK=false}$('status').textContent='已裁决 '+D.items.filter(x=>records[x.id]&&complete(records[x.id])).length+' / '+D.items.length+(storageOK?'':' · 请下载备份')}
function reasons(panel,i,r){panel.replaceChildren();panel.hidden=!['fail','uncertain'].includes(r.usability[i]);if(panel.hidden)return;D.reasonOptions[i].forEach(o=>{let l=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=r.usability_reasons[i].includes(o.code);input.disabled=complete(r);input.onchange=()=>{r.usability_reasons[i]=input.checked?[...r.usability_reasons[i],o.code]:r.usability_reasons[i].filter(x=>x!==o.code);if(!r.usability_reasons[i].includes('other'))r.usability_other[i]='';reasons(panel,i,r);persist()};l.append(input,document.createTextNode(o.label));panel.append(l)});if(r.usability_reasons[i].includes('other')){let t=document.createElement('textarea');t.placeholder='请说明其它原因';t.value=r.usability_other[i];t.disabled=complete(r);t.oninput=()=>{r.usability_other[i]=t.value;persist()};panel.append(t)}}
function selectField(title,value,options,onchange,locked){let box=document.createElement('div'),label=document.createElement('label'),select=document.createElement('select');box.className='question';label.textContent=title;select.setAttribute('aria-label',title);[['','请选择'],...options].forEach(([v,t])=>{let o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)});select.value=value;select.disabled=locked;select.onchange=()=>onchange(select.value);box.append(label,select);return box}
function originalText(r,field,i){if(field==='realism')return realism[r.realism];if(field==='requirements')return r.requirements[i]==='pass'?'是':'否';let value=names[r.usability[i]];let reasons=r.usability_reasons[i].map(c=>D.reasonOptions[i].find(o=>o.code===c).label).join('、');return value+(reasons?'；'+reasons:'')+(r.usability_other[i]?'；'+r.usability_other[i]:'')}
function render(){let item=D.items[index],r=current(),locked=complete(r);$('id').textContent=item.id;$('position').textContent=(index+1)+' / '+D.items.length;$('image').src=item.image;$('jump').value=item.id;$('original').replaceChildren();let questions=[...D.usability.map((text,i)=>({text,field:'usability',i})),{text:D.realismQuestion,field:'realism',i:0},...item.checks.map((text,i)=>({text,field:'requirements',i}))];questions.forEach(q=>{let tr=document.createElement('tr'),a=document.createElement('td'),b=document.createElement('td'),c=document.createElement('td');a.textContent=q.text;b.textContent=originalText(item.R1,q.field,q.i);c.textContent=originalText(item.R2,q.field,q.i);let va=q.field==='realism'?item.R1.realism:item.R1[q.field][q.i],vb=q.field==='realism'?item.R2.realism:item.R2[q.field][q.i];if(va!==vb)tr.className='different';tr.append(a,b,c);$('original').append(tr)});$('fields').replaceChildren();D.usability.forEach((text,i)=>{let panel=document.createElement('div');panel.className='reasons';let box=selectField('可用性'+(i+1)+'：'+text,r.usability[i],Object.entries(names),v=>{r.usability[i]=v;if(['','pass'].includes(v)){r.usability_reasons[i]=[];r.usability_other[i]=''}reasons(panel,i,r);persist()},locked);box.append(panel);$('fields').append(box);reasons(panel,i,r)});$('fields').append(selectField(D.realismQuestion,r.realism,Object.entries(realism),v=>{r.realism=v;persist()},locked));item.checks.forEach((text,i)=>$('fields').append(selectField('提示词'+(i+1)+'：'+text,r.requirements[i],[['pass','是'],['fail','否']],v=>{r.requirements[i]=v;persist()},locked)));$('confirm').hidden=locked;$('edit').hidden=!locked;$('adopt1').disabled=locked;$('adopt2').disabled=locked;$('previous').disabled=index===0;$('next').disabled=index===D.items.length-1;persist()}
function adopt(rater){let item=D.items[index];records[item.id]={...structuredClone(item[rater]),revealed_at:null};$('message').textContent='已采用 '+rater+' 答案，请核对并确认。';render()}
$('adopt1').onclick=()=>adopt('R1');$('adopt2').onclick=()=>adopt('R2');$('confirm').onclick=()=>{let r=current(),fields=missing(r);if(fields.length){$('message').textContent='请完成：'+fields.join('、');return}valid(r);r.revealed_at=new Date().toISOString();render();$('message').textContent='本张已确认。'};$('edit').onclick=()=>{current().revealed_at=null;render()};
function navigate(i){index=Math.max(0,Math.min(D.items.length-1,i));$('message').textContent='';render()}
$('previous').onclick=()=>navigate(index-1);$('next').onclick=()=>{if(!complete(current())){$('message').textContent='请先确认本张最终判断。';return}navigate(index+1)};D.items.forEach(item=>{let o=document.createElement('option');o.value=item.id;o.textContent=item.id;$('jump').append(o)});$('jump').onchange=()=>navigate(D.items.findIndex(x=>x.id===$('jump').value));
$('save').onclick=()=>{let confirmed=Object.values(records).filter(complete);let data={rule:D.rule,protocol:D.protocol,rater:'ADJ',started_at:started,exported_at:new Date().toISOString(),completed:confirmed.length,total:D.items.length,records:confirmed,drafts:records};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='anonymous_adjudication_v3.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('message').textContent='已导出 '+confirmed.length+'/'+D.items.length+' 张已确认裁决及草稿备份。'};
$('load').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let f=$('file').files[0];if(!f)return;let d=JSON.parse(await f.text());if(d.rule!==D.rule||d.protocol!==D.protocol||d.rater!=='ADJ'||!Array.isArray(d.records))throw Error('版本或评分者不匹配');let next={};for(let r of d.records){valid(r);if(next[r.blind_id])throw Error('重复编号');next[r.blind_id]=r}if(d.drafts){for(let [id,r] of Object.entries(d.drafts)){valid(r);if(id!==r.blind_id)throw Error('草稿编号不匹配');next[id]=r}}records=next;started=d.started_at||started;index=0;render();$('message').textContent='裁决备份已恢复。'}catch(e){$('message').textContent='导入失败：'+e.message}$('file').value=''};
$('image').onclick=()=>{$('large').src=D.items[index].image;$('zoom').showModal()};$('close').onclick=()=>$('zoom').close();render();
</script></body></html>
