<div class="card" id="second" hidden><h2>第二阶段：提示词要求</h2><p class="hint">每图四道是非题，按画面选择“是”或“否”。不评价气瓶数量，无需填写理由。</p><div id="checks"></div></div></section></main>

function message(t){$('message').textContent=t}
function renderReasons(panel,i,r){panel.replaceChildren();panel.hidden=!['fail','uncertain'].includes(r.usability[i]);if(panel.hidden)return;let hint=document.createElement('div');hint.className='hint';hint.textContent='选择原因（可多选）';let choices=document.createElement('div');choices.className='reasonChoices';D.reasonOptions[i].forEach(option=>{let label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=r.usability_reasons[i].includes(option.code);input.disabled=!!r.revealed_at;input.onchange=()=>{r.usability_reasons[i]=input.checked?[...r.usability_reasons[i],option.code]:r.usability_reasons[i].filter(x=>x!==option.code);if(!r.usability_reasons[i].includes('other'))r.usability_other[i]='';renderReasons(panel,i,r);persist()};label.append(input,document.createTextNode(option.label));choices.append(label)});panel.append(hint,choices);if(r.usability_reasons[i].includes('other')){let note=document.createElement('textarea');note.placeholder='请简要说明其它原因';note.setAttribute('aria-label','第'+(i+1)+'题其它说明');note.value=r.usability_other[i];note.disabled=!!r.revealed_at;note.oninput=()=>{r.usability_other[i]=note.value;persist()};panel.append(note)}}
function render(){let item=D.items[index],r=current();$('rater').textContent='评分者 '+D.rater+' · v3';$('imageId').textContent=item.id;$('position').textContent=(index+1)+' / '+D.items.length;$('image').src=item.image;$('jump').value=item.id;$('usable').replaceChildren();D.usability.forEach((text,i)=>{let row=document.createElement('div'),question=document.createElement('div'),label=document.createElement('label'),select=document.createElement('select'),reasons=document.createElement('div');row.className='criterion';question.className='question';reasons.className='reasons';reasons.dataset.item=i;label.textContent=(i+1)+'. '+text;select.id='usability-'+i;label.htmlFor=select.id;select.setAttribute('aria-label',text);[['','请选择'],['pass','通过'],['fail','不通过'],['uncertain','不确定']].forEach(([value,name])=>{let option=document.createElement('option');option.value=value;option.textContent=name;select.append(option)});select.value=r.usability[i];select.disabled=!!r.revealed_at;select.onchange=()=>{r.usability[i]=select.value;if(['','pass'].includes(select.value)){r.usability_reasons[i]=[];r.usability_other[i]=''}renderReasons(reasons,i,r);persist()};question.append(label,select);row.append(question,reasons);$('usable').append(row);renderReasons(reasons,i,r)});
$('realism').value=r.realism;$('realism').disabled=!!r.revealed_at;$('reveal').hidden=!!r.revealed_at;$('locked').textContent=r.revealed_at?'第一阶段已确认并锁定。':'';$('second').hidden=!r.revealed_at;$('checks').replaceChildren();if(r.revealed_at)item.checks.forEach((text,i)=>{let row=document.createElement('fieldset'),legend=document.createElement('legend'),answers=document.createElement('div');row.className='criterion';legend.textContent=(i+1)+'. '+text;answers.className='answers';[['pass','是'],['fail','否']].forEach(([value,name])=>{let label=document.createElement('label'),radio=document.createElement('input');radio.type='radio';radio.name='requirement-'+i;radio.value=value;radio.checked=r.requirements[i]===value;radio.onchange=()=>{r.requirements[i]=value;persist()};label.append(radio,document.createTextNode(name));answers.append(label)});row.append(legend,answers);$('checks').append(row)});$('previous').disabled=index===0;$('next').disabled=index===D.items.length-1;persist()}
function navigate(next){index=Math.max(0,Math.min(D.items.length-1,next));message('');render()}
$('realismLabel').textContent='3. '+D.realismQuestion;D.realismOptions.forEach(x=>{let o=document.createElement('option');o.value=x.code;o.textContent=x.label;$('realism').append(o)});$('realism').onchange=()=>{current().realism=$('realism').value;persist()};
$('reveal').onclick=()=>{let r=current(),fields=firstMissing(r);if(fields.length){message('请完成：'+fields.join('、'));return}r.revealed_at=new Date().toISOString();message('');render()};
$('previous').onclick=()=>navigate(index-1);$('next').onclick=()=>{let r=current();if(!complete(r))message('当前图片尚未完成：'+missing(r).join('、'));else navigate(index+1)};
D.items.forEach(item=>{let option=document.createElement('option');option.value=item.id;option.textContent=item.id;$('jump').append(option)});$('jump').onchange=()=>navigate(D.items.findIndex(i=>i.id===$('jump').value));
$('image').onclick=()=>{$('large').src=D.items[index].image;$('zoom').showModal()};$('closeZoom').onclick=()=>$('zoom').close();
$('save').onclick=()=>{let list=D.items.map(i=>records[i.id]||blank(i)),count=list.filter(complete).length;let payload={rule:D.rule,protocol:D.protocol,rater:D.rater,started_at:started,exported_at:new Date().toISOString(),completed:count,total:D.items.length,records:list,missing:list.filter(r=>!complete(r)).map(r=>({blind_id:r.blind_id,fields:missing(r)}))};let link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));link.download='anonymous_review_v3_'+D.rater+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);message(`已导出：完成 ${count}/${D.items.length}，待完成 ${D.items.length-count} 张。请保存 JSON。`)};
$('load').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let file=$('file').files[0];if(!file)return;let data=JSON.parse(await file.text());if(data.rule!==D.rule)throw Error('评分版本不同；旧版备份请保留，新版需重新评分');if(data.protocol!==D.protocol||data.rater!==D.rater||!Array.isArray(data.records))throw Error('备份规则、评分者或结构不匹配');let next={},seen=new Set;data.records.forEach(r=>{validateRecord(r);if(seen.has(r.blind_id))throw Error('重复匿名编号');seen.add(r.blind_id);next[r.blind_id]=r});records=next;started=data.started_at||started;index=0;render();message('备份已恢复。')}catch(e){message('导入失败：'+e.message)}$('file').value=''};
render();
</script></body></html>
