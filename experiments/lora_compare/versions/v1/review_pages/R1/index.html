function current(){let item=D.items[index];return records[item.id]||(records[item.id]=blank(item))}
function complete(r){return r.usability.every(Boolean)&&r.requirements.every(Boolean)&&r.visible_count!==''&&r.visible_count!==null&&r.revealed_at&&(!r.usability.some(v=>v!=='pass')||(r.reasons.length&&r.usability_note.trim()))&&(!r.requirements.some(v=>v!=='pass')||r.note.trim())}
function missing(r){let fields=[];r.usability.forEach((v,i)=>{if(!v)fields.push('可用性'+(i+1))});if(!r.revealed_at)fields.push('第二阶段未开启');r.requirements.forEach((v,i)=>{if(!v)fields.push('要求'+(i+1))});if(r.visible_count===''||r.visible_count===null)fields.push('可见数量');if(r.usability.some(v=>v&&v!=='pass')){if(!r.reasons.length)fields.push('原因代码');if(!r.usability_note.trim())fields.push('可用性原因')}if(r.requirements.some(v=>v&&v!=='pass')&&!r.note.trim())fields.push('要求原因');return fields}
function persist(){try{localStorage.setItem(key,JSON.stringify({records,index,started}))}catch(e){storageOK=false}$('status').textContent=`已完成 ${D.items.filter(i=>records[i.id]&&complete(records[i.id])).length} / ${D.items.length}`+(storageOK?'':' · 自动保存不可用，请下载备份')}
function message(t){$('message').textContent=t}
function choices(container,texts,values,disabled,onchange){container.replaceChildren();texts.forEach((text,i)=>{let row=document.createElement('div');row.className='criterion';let label=document.createElement('label');label.textContent=(i+1)+'. '+text;let select=document.createElement('select');select.setAttribute('aria-label',text);[['','请选择'],['pass','pass · 通过'],['fail','fail · 不通过'],['uncertain','uncertain · 不确定']].forEach(([value,name])=>{let op=document.createElement('option');op.value=value;op.textContent=name;select.append(op)});select.value=values[i]||'';select.disabled=disabled;select.onchange=()=>{values[i]=select.value;onchange();persist()};row.append(label,select);container.append(row)})}
function render(){let item=D.items[index],r=current();$('rater').textContent='评分者 '+D.rater;$('imageId').textContent=item.id;$('position').textContent=(index+1)+' / '+D.items.length;$('image').src=item.image;$('jump').value=item.id;
choices($('usable'),D.usability,r.usability,!!r.revealed_at,()=>{});$('reasons').replaceChildren();const names=['无目标','目标畸形','实例融合','标注含糊','严重场景缺陷','其它'];D.reasons.forEach((code,i)=>{let label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=r.reasons.includes(code);input.disabled=!!r.revealed_at;input.onchange=()=>{r.reasons=input.checked?[...r.reasons,code]:r.reasons.filter(v=>v!==code);persist()};label.append(input,document.createTextNode(names[i]));$('reasons').append(label)});
$('usableNote').value=r.usability_note;$('usableNote').disabled=!!r.revealed_at;$('reveal').hidden=!!r.revealed_at;$('locked').textContent=r.revealed_at?'已显示提示词，第一阶段判断已锁定。':'';$('second').hidden=!r.revealed_at;$('prompt').textContent=r.revealed_at?item.prompt:'';choices($('checks'),item.checks,r.requirements,false,()=>{});$('count').value=r.visible_count;$('note').value=r.note;$('previous').disabled=index===0;$('next').disabled=index===D.items.length-1;persist()}
function navigate(next){index=Math.max(0,Math.min(D.items.length-1,next));message('');render()}
$('usableNote').oninput=()=>{current().usability_note=$('usableNote').value;persist()};$('note').oninput=()=>{current().note=$('note').value;persist()};$('count').oninput=()=>{let value=$('count').value.trim();current().visible_count=value==='uncertain'?'uncertain':/^\d+$/.test(value)?Number(value):'';message(value&&!/^\d+$/.test(value)&&value!=='uncertain'?'数量应填写非负整数或 uncertain':'');persist()};
$('reveal').onclick=()=>{let r=current();if(!r.usability.every(Boolean)){message('请先完成三项训练可用性判断。');return}if(r.usability.some(v=>v!=='pass')&&(!r.reasons.length||!r.usability_note.trim())){message('非通过判断需要原因代码与说明。');return}r.revealed_at=new Date().toISOString();message('');render()};
$('previous').onclick=()=>navigate(index-1);$('next').onclick=()=>{let r=current();if(!complete(r))message('当前图片尚未完成：'+missing(r).join('、'));else navigate(index+1)};
D.items.forEach(item=>{let op=document.createElement('option');op.value=item.id;op.textContent=item.id;$('jump').append(op)});$('jump').onchange=()=>navigate(D.items.findIndex(i=>i.id===$('jump').value));
$('image').onclick=()=>{$('large').src=D.items[index].image;$('zoom').showModal()};$('closeZoom').onclick=()=>$('zoom').close();
$('save').onclick=()=>{let list=D.items.map(i=>records[i.id]||blank(i));let count=list.filter(complete).length;let payload={rule:D.rule,protocol:D.protocol,rater:D.rater,started_at:started,exported_at:new Date().toISOString(),completed:count,total:D.items.length,records:list,missing:list.filter(r=>!complete(r)).map(r=>({blind_id:r.blind_id,fields:missing(r)}))};let link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));link.download='anonymous_review_'+D.rater+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);message(`已导出：完成 ${count}/${D.items.length}，待完成 ${D.items.length-count} 张。请妥善保存 JSON。`)};
$('load').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let file=$('file').files[0];if(!file)return;let data=JSON.parse(await file.text());if(data.rule!==D.rule||data.protocol!==D.protocol||data.rater!==D.rater||!Array.isArray(data.records))throw Error('备份的规则、评分者或结构不匹配');let next={},seen=new Set;data.records.forEach(r=>{if(!allowed.has(r.blind_id)||seen.has(r.blind_id))throw Error('未知或重复匿名编号');seen.add(r.blind_id);let item=D.items.find(i=>i.id===r.blind_id);if(!Array.isArray(r.usability)||r.usability.length!==3||!Array.isArray(r.requirements)||r.requirements.length!==item.checks.length||[...r.usability,...r.requirements].some(v=>!['','pass','fail','uncertain'].includes(v)))throw Error('无效评分项');if(!(r.visible_count===''||r.visible_count==='uncertain'||Number.isInteger(r.visible_count)&&r.visible_count>=0)||typeof r.note!=='string'||typeof r.usability_note!=='string'||!Array.isArray(r.reasons)||r.reasons.some(v=>!D.reasons.includes(v)))throw Error('无效数量或原因');next[r.blind_id]=r});records=next;started=data.started_at||started;index=0;render();message('备份已恢复。')}catch(e){message('导入失败：'+e.message)}$('file').value=''};
render();
</script></body></html>
