<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>匿名图像评审</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#192d39;background:#f0f4f6}*{box-sizing:border-box}body{margin:0}header{padding:18px 28px;background:#173c50;color:#fff;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0 0 5px}p{line-height:1.6}button,select,input,textarea{font:inherit}button{border:1px solid #b7c7d0;background:white;border-radius:7px;padding:9px 14px;cursor:pointer;color:#173c50}button.primary{background:#17647b;color:white;border:0}button:disabled{opacity:.45;cursor:default}.tools{display:flex;flex-wrap:wrap;gap:8px;padding:14px 28px;align-items:center;background:white;border-bottom:1px solid #ccd7dd}.tools span{flex:1}main{display:grid;grid-template-columns:minmax(340px,1.1fr) minmax(340px,1fr);gap:20px;padding:22px;max-width:1600px;margin:auto}.picture{position:sticky;top:18px;align-self:start;background:#fff;padding:14px;border-radius:12px}.picture img{display:block;width:100%;height:auto;cursor:zoom-in}.card{background:white;padding:20px;border-radius:12px;margin-bottom:16px}h2{font-size:18px;margin:0 0 12px}.hint{color:#526b78;font-size:14px}.criterion{padding:15px 0;border-bottom:1px solid #e4ebef;line-height:1.6}.question{display:flex;justify-content:space-between;gap:12px;align-items:center}.question label{flex:1}.question select{width:125px;flex-shrink:0}select,textarea{border:1px solid #b8c9d2;border-radius:5px;padding:8px;background:white;color:#192d39}textarea{min-height:64px;width:100%;margin-top:8px}label{line-height:1.7}.reasons{padding:10px 12px;margin-top:10px;background:#f3f7f9;border-radius:6px}.reasonChoices{display:flex;gap:7px;flex-wrap:wrap}.reasonChoices label{font-size:14px;padding:4px 6px}.reasonChoices input{margin-right:5px}.answers{display:flex;gap:10px;margin-top:10px}.answers label{cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 20px;border:1px solid #b8c9d2;border-radius:7px}.answers label:has(input:checked){background:#e5f1f5;border-color:#17647b;color:#124b60}.answers input{accent-color:#17647b}fieldset{border:0;padding:0;margin:0}legend{padding:0}#status{font-weight:600}#message{padding:10px 28px;color:#a03e1d;min-height:42px}.nav{display:flex;gap:10px;align-items:center;justify-content:space-between}.badge{font-size:13px;background:#edf5f8;padding:6px 9px;border-radius:5px}dialog{border:0;border-radius:8px;max-width:96vw;max-height:96vh;padding:12px}dialog::backdrop{background:#142734cc}dialog img{max-width:90vw;max-height:84vh;object-fit:contain}.dialogBar{text-align:right;margin-bottom:8px}[hidden]{display:none!important}@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}.picture{position:static}header{padding:16px}.tools{padding:12px}}
</style></head><body>
<header><div><h1>匿名图像评审</h1><div>完整图片 · 独立判断 · 先可用性，后提示词</div></div><div id="rater"></div></header>
<div class="tools"><button id="save" class="primary">下载评分 JSON</button><button id="load">导入备份</button><input id="file" type="file" accept=".json" hidden><span id="status"></span><label style="width:160px">跳转图片 <select id="jump"></select></label></div>
<div id="message" role="status" aria-live="polite"></div>
<main><section class="picture"><div class="nav"><strong id="imageId"></strong><span class="badge" id="position"></span></div><p class="hint">点击图片放大，按完整画面评价。</p><img id="image" alt="待评审完整图像"><p class="hint">每次结束请下载 JSON 备份，更换浏览器或电脑后可导入续评。</p><div class="nav"><button id="previous">上一张</button><button id="next">下一张</button></div></section>
<section><div class="card"><h2>第一阶段：检测训练可用性</h2><p class="hint">符合题意选“通过”；有问题选“不通过”。选择原因即可，仅“其它”需要说明。正常遮挡或画面边缘截断本身不判为缺陷。</p><div id="usable"></div><p id="locked" class="hint"></p><button id="reveal" class="primary">确认可用性，进入第二阶段</button></div>
<div class="card" id="second" hidden><h2>第二阶段：提示词要求</h2><p class="hint">每图四道是非题，按画面选择“是”或“否”。不评价气瓶数量，无需填写理由。</p><div id="checks"></div></div></section></main>
<dialog id="zoom"><div class="dialogBar"><button id="closeZoom">关闭放大</button></div><img id="large" alt="完整图像放大"></dialog>
<script>
const D=__REVIEW_DATA__;
const $=id=>document.getElementById(id);
const key='lc-review-'+D.rule+'-'+D.rater+'-'+D.protocol;
let records={},index=0,started=new Date().toISOString(),storageOK=true;
const allowed=new Set(D.items.map(x=>x.id));
function blank(item){return {blind_id:item.id,usability:Array(3).fill(''),requirements:Array(4).fill(''),usability_reasons:[[],[],[]],usability_other:['','',''],revealed_at:null}}
function current(){let item=D.items[index];return records[item.id]||(records[item.id]=blank(item))}
function firstMissing(r){let fields=[];r.usability.forEach((value,i)=>{if(!value)fields.push('可用性'+(i+1));else if(value!=='pass'){if(!r.usability_reasons[i].length)fields.push('第'+(i+1)+'题原因');if(r.usability_reasons[i].includes('other')&&!r.usability_other[i].trim())fields.push('第'+(i+1)+'题其它说明')}});return fields}
function missing(r){let fields=firstMissing(r);if(!r.revealed_at)fields.push('第二阶段未开启');r.requirements.forEach((v,i)=>{if(!v)fields.push('要求'+(i+1))});return fields}
function complete(r){return missing(r).length===0}
function validateRecord(r){if(!r||!allowed.has(r.blind_id))throw Error('未知匿名编号');if(!Array.isArray(r.usability)||r.usability.length!==3||r.usability.some(v=>!['','pass','fail','uncertain'].includes(v)))throw Error('第一阶段评分无效');if(!Array.isArray(r.requirements)||r.requirements.length!==4||r.requirements.some(v=>!['','pass','fail'].includes(v)))throw Error('第二阶段必须是四道是非题');if('visible_count' in r)throw Error('新版不接收数量字段');if(!Array.isArray(r.usability_reasons)||r.usability_reasons.length!==3||!Array.isArray(r.usability_other)||r.usability_other.length!==3)throw Error('原因结构无效');r.usability_reasons.forEach((list,i)=>{let valid=new Set(D.reasonOptions[i].map(x=>x.code));if(!Array.isArray(list)||list.some(x=>!valid.has(x))||new Set(list).size!==list.length||typeof r.usability_other[i]!=='string')throw Error('题目原因无效');if(r.usability_other[i].trim()&&!list.includes('other'))throw Error('其它说明缺少对应选项');if(['','pass'].includes(r.usability[i])&&(list.length||r.usability_other[i].trim()))throw Error('通过或未答题不应有原因')});if(r.revealed_at!==null&&typeof r.revealed_at!=='string')throw Error('阶段记录无效');if(r.requirements.some(Boolean)&&!r.revealed_at)throw Error('第二阶段缺少确认记录');if(r.revealed_at&&firstMissing(r).length)throw Error('第一阶段未完成');return r}
try{let saved=JSON.parse(localStorage.getItem(key)||'null');if(saved){Object.values(saved.records||{}).forEach(validateRecord);records=saved.records||{};index=Number.isInteger(saved.index)&&saved.index>=0&&saved.index<D.items.length?saved.index:0;started=saved.started||started}}catch(e){storageOK=false}
function persist(){try{localStorage.setItem(key,JSON.stringify({records,index,started}))}catch(e){storageOK=false}$('status').textContent=`已完成 ${D.items.filter(i=>records[i.id]&&complete(records[i.id])).length} / ${D.items.length}`+(storageOK?'':' · 请下载备份')}
function message(t){$('message').textContent=t}
function renderReasons(panel,i,r){panel.replaceChildren();panel.hidden=!['fail','uncertain'].includes(r.usability[i]);if(panel.hidden)return;let hint=document.createElement('div');hint.className='hint';hint.textContent='选择原因（可多选）';let choices=document.createElement('div');choices.className='reasonChoices';D.reasonOptions[i].forEach(option=>{let label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=r.usability_reasons[i].includes(option.code);input.disabled=!!r.revealed_at;input.onchange=()=>{r.usability_reasons[i]=input.checked?[...r.usability_reasons[i],option.code]:r.usability_reasons[i].filter(x=>x!==option.code);if(!r.usability_reasons[i].includes('other'))r.usability_other[i]='';renderReasons(panel,i,r);persist()};label.append(input,document.createTextNode(option.label));choices.append(label)});panel.append(hint,choices);if(r.usability_reasons[i].includes('other')){let note=document.createElement('textarea');note.placeholder='请简要说明其它原因';note.setAttribute('aria-label','第'+(i+1)+'题其它说明');note.value=r.usability_other[i];note.disabled=!!r.revealed_at;note.oninput=()=>{r.usability_other[i]=note.value;persist()};panel.append(note)}}
function render(){let item=D.items[index],r=current();$('rater').textContent='评分者 '+D.rater+' · v2';$('imageId').textContent=item.id;$('position').textContent=(index+1)+' / '+D.items.length;$('image').src=item.image;$('jump').value=item.id;$('usable').replaceChildren();D.usability.forEach((text,i)=>{let row=document.createElement('div'),question=document.createElement('div'),label=document.createElement('label'),select=document.createElement('select'),reasons=document.createElement('div');row.className='criterion';question.className='question';reasons.className='reasons';reasons.dataset.item=i;label.textContent=(i+1)+'. '+text;select.id='usability-'+i;label.htmlFor=select.id;select.setAttribute('aria-label',text);[['','请选择'],['pass','通过'],['fail','不通过'],['uncertain','不确定']].forEach(([value,name])=>{let option=document.createElement('option');option.value=value;option.textContent=name;select.append(option)});select.value=r.usability[i];select.disabled=!!r.revealed_at;select.onchange=()=>{r.usability[i]=select.value;if(['','pass'].includes(select.value)){r.usability_reasons[i]=[];r.usability_other[i]=''}renderReasons(reasons,i,r);persist()};question.append(label,select);row.append(question,reasons);$('usable').append(row);renderReasons(reasons,i,r)});
$('reveal').hidden=!!r.revealed_at;$('locked').textContent=r.revealed_at?'第一阶段已确认并锁定。':'';$('second').hidden=!r.revealed_at;$('checks').replaceChildren();if(r.revealed_at)item.checks.forEach((text,i)=>{let row=document.createElement('fieldset'),legend=document.createElement('legend'),answers=document.createElement('div');row.className='criterion';legend.textContent=(i+1)+'. '+text;answers.className='answers';[['pass','是'],['fail','否']].forEach(([value,name])=>{let label=document.createElement('label'),radio=document.createElement('input');radio.type='radio';radio.name='requirement-'+i;radio.value=value;radio.checked=r.requirements[i]===value;radio.onchange=()=>{r.requirements[i]=value;persist()};label.append(radio,document.createTextNode(name));answers.append(label)});row.append(legend,answers);$('checks').append(row)});$('previous').disabled=index===0;$('next').disabled=index===D.items.length-1;persist()}
function navigate(next){index=Math.max(0,Math.min(D.items.length-1,next));message('');render()}
$('reveal').onclick=()=>{let r=current(),fields=firstMissing(r);if(fields.length){message('请完成：'+fields.join('、'));return}r.revealed_at=new Date().toISOString();message('');render()};
$('previous').onclick=()=>navigate(index-1);$('next').onclick=()=>{let r=current();if(!complete(r))message('当前图片尚未完成：'+missing(r).join('、'));else navigate(index+1)};
D.items.forEach(item=>{let option=document.createElement('option');option.value=item.id;option.textContent=item.id;$('jump').append(option)});$('jump').onchange=()=>navigate(D.items.findIndex(i=>i.id===$('jump').value));
$('image').onclick=()=>{$('large').src=D.items[index].image;$('zoom').showModal()};$('closeZoom').onclick=()=>$('zoom').close();
$('save').onclick=()=>{let list=D.items.map(i=>records[i.id]||blank(i)),count=list.filter(complete).length;let payload={rule:D.rule,protocol:D.protocol,rater:D.rater,started_at:started,exported_at:new Date().toISOString(),completed:count,total:D.items.length,records:list,missing:list.filter(r=>!complete(r)).map(r=>({blind_id:r.blind_id,fields:missing(r)}))};let link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));link.download='anonymous_review_v2_'+D.rater+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);message(`已导出：完成 ${count}/${D.items.length}，待完成 ${D.items.length-count} 张。请保存 JSON。`)};
$('load').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let file=$('file').files[0];if(!file)return;let data=JSON.parse(await file.text());if(data.rule!==D.rule)throw Error('评分版本不同；旧版备份请保留，新版需重新评分');if(data.protocol!==D.protocol||data.rater!==D.rater||!Array.isArray(data.records))throw Error('备份规则、评分者或结构不匹配');let next={},seen=new Set;data.records.forEach(r=>{validateRecord(r);if(seen.has(r.blind_id))throw Error('重复匿名编号');seen.add(r.blind_id);next[r.blind_id]=r});records=next;started=data.started_at||started;index=0;render();message('备份已恢复。')}catch(e){message('导入失败：'+e.message)}$('file').value=''};
render();
</script></body></html>
